[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signaldeck-plugin-sqlite"
version = "0.5.0"
description = "SQLite plugin for SignalDeck providing sqlite-datastore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
   "signaldeck-sdk>=0.5.0",
  "SQLAlchemy>=2.0.44"
]


[tool.setuptools.packages.find]
where = ["."]
include = ["signaldeck_plugin_sqlite*"]


