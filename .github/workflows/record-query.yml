name: Record Query
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - name: Install SDK (feature branch when available, otherwise main)
        run: |
          REF=main
          if git ls-remote --exit-code --heads https://github.com/signaldeck/signaldeck-sdk.git feat/filtered-record-query-20261107 > /dev/null; then
            REF=feat/filtered-record-query-20261107
          fi
          python -m pip install "git+https://github.com/signaldeck/signaldeck-sdk.git@${REF}"
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install "SQLAlchemy>=2.0.44" pytest
      - run: python -m pytest -q
